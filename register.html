<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản E-Commerce</title>
</head>
<body>

    <form action="#" method="POST">
        <h2>Đăng ký tài khoản</h2>
        <!-- Fieldset 1: Thông tin cá nhân -->
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div>
                <label for="fullname">Họ tên:</label>
                <input type="text" id="fullname" name="fullname" 
                       required minlength="2" maxlength="50" placeholder="Nhập họ và tên">
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" 
                       required placeholder="example@gmail.com">
            </div>

            <div>
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" 
                       pattern="[0-9]{10}" placeholder="0123456789">
            </div>

            <div>
                <label for="dob">Ngày sinh:</label>
                <!-- Lưu ý: Thay đổi max thành ngày hiện tại của bạn -->
                <input type="date" id="dob" name="dob" max="2026-04-30">
            </div>

            <div>
                <label>Giới tính:</label>
                <input type="radio" id="male" name="gender" value="nam">
                <label style="display:inline" for="male">Nam</label>
                
                <input type="radio" id="female" name="gender" value="nu">
                <label style="display:inline" for="female">Nữ</label>
                
                <input type="radio" id="other" name="gender" value="khac">
                <label style="display:inline" for="other">Khác</label>
            </div>
        </fieldset>

        <!-- Fieldset 2: Tài khoản -->
        <fieldset>
            <legend>Tài khoản</legend>
            
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" 
                       pattern="[A-Za-z0-9_]{3,20}" 
                       placeholder="Chữ cái, số hoặc dấu gạch dưới (3-20 ký tự)">
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" 
                       minlength="8" 
                       pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                       placeholder="Ít nhất 8 ký tự, 1 chữ hoa, 1 số">
            </div>

            <div>
                <label for="confirm_password">Xác nhận password:</label>
                <input type="password" id="confirm_password" name="confirm_password" 
                       minlength="8" 
                       pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                       placeholder="Nhập lại mật khẩu">
            </div>
        </fieldset>

        <!-- Fieldset 3: Thông tin giao hàng -->
        <fieldset>
            <legend>Thông tin giao hàng</legend>
            
            <div>
                <label for="city">Thành phố:</label>
                <select id="city" name="city">
                    <option value="">--Chọn Thành phố--</option>
                    <option value="hanoi">Hà Nội</option>
                    <option value="hcm">TP. Hồ Chí Minh</option>
                    <option value="danang">Đà Nẵng</option>
                    <option value="cantho">Cần Thơ</option>
                    <option value="haiphong">Hải Phòng</option>
                </select>
            </div>

            <div>
                <label for="district">Quận/Huyện:</label>
                <select id="district" name="district">
                    <option value="q1">Quận 1 / Quận Ba Đình</option>
                    <option value="q2">Quận 2 / Quận Hoàn Kiếm</option>
                </select>
            </div>

            <div>
                <label for="address">Địa chỉ chi tiết:</label>
                <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường..."></textarea>
            </div>
        </fieldset>

        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label style="display:inline" for="terms">Tôi đồng ý với các điều khoản dịch vụ</label>
        </div>

        <div class="btn-group">
            <button type="submit">Đăng ký</button>
            <button type="reset">Làm lại</button>
        </div>

    </form>

</body>
</html>
