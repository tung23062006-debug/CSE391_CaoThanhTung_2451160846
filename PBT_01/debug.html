<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web - ShopTLU</title>
</head>

<body>
    <header>
        <h1>Welcome to ShopTLU</h1>
        <nav>
            <a href="#home">Trang chủ</a>
            <a href="#products">Sản phẩm</a>
        </nav>
    </header>

    <main>
        <section id="products">
            <h2>Sản phẩm hot</h2>
            <figure>
                <img src="iphone.jpg" alt="iPhone 16 Pro">
                <figcaption>iPhone 16 Pro</figcaption>
            </figure>
            <p>Giá: <b>25.990.000đ</b></p>
        </section>

        <section>
            <h2>Thông tin sản phẩm</h2>
            <table>
                <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Giá</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>iPhone</td>
                        <td>25tr</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <aside>
        <p>Sidebar content</p>
    </aside>

    <footer>
        <p>Copyright 2026 &copy; ShopTLU</p>
    </footer>
</body>

</html>
