<!DOCTYPE html>
<html>

<head>
    <style>
        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }

        .content-box {
            box-sizing: content-box;
            background-color: #e74c3c;
        }

        .border-box {
            box-sizing: border-box;
            background-color: #3498db;
        }
    </style>
</head>

<body>
    <div class="box content-box">Hộp 1: Content-box</div>
    <div class="box border-box">Hộp 2: Border-box</div>
</body>

</html>
