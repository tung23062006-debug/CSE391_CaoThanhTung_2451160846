<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Kiểm tra CSS Selectors</title>
    <style>
        .product.featured h2 {
            background-color: yellow;
            border: 2px solid red;
        }

        body {
            font-family: sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .dark {
            background: #333;
            color: white;
            padding: 10px;
        }

        nav a {
            margin-right: 10px;
            color: cyan;
        }

        .product {
            border: 1px solid #ccc;
            margin: 10px 0;
            padding: 10px;
        }

        .featured {
            border: 2px solid orange;
        }
    </style>
</head>

<body>

    <div id="app">
        <header class="top-bar dark">
            <h1>ShopTLU</h1>
            <nav>
                <a href="/" class="active">Home</a>
                <a href="/products">Products</a>
                <a href="/about">About</a>
            </nav>
        </header>
        <main>
            <article class="product">
                <h2>iPhone 16</h2>
                <p class="price">25.990.000đ</p>
                <p>Mô tả sản phẩm...</p>
            </article>
            <article class="product featured">
                <h2>MacBook Pro</h2>
                <p class="price">45.990.000đ</p>
                <p>Mô tả sản phẩm...</p>
            </article>
        </main>
    </div>

</body>

</html>
